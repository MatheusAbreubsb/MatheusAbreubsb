
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MatheusAbreubsb
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1D4ED8&color_dots=#E2E8F0,#BFDBFE,#93C5FD,#60A5FA,#2563EB
            dist/github-contribution-grid-snake-dark.svg?color_snake=#38BDF8&color_dots=#172235,#1E3A5F,#1D4ED8,#2563EB,#60A5FA

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
